<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lo siento</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    :root {
      --ink: #fff8ff;
      --soft: #f7dcff;
      --lilac: #d9b8ff;
      --violet: #8d5bd1;
      --plum: #44245f;
      --deep: #1b1028;
      --rose: #ffd3ea;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at 50% 0%, rgba(233, 199, 255, 0.38), transparent 38%),
        linear-gradient(145deg, #25123a 0%, #6f3fa3 48%, #c9a1f4 100%);
      overflow: hidden;
      color: var(--ink);
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .heart {
      position: absolute;
      bottom: -24px;
      color: rgba(255, 232, 255, 0.72);
      text-shadow: 0 0 14px rgba(216, 177, 255, 0.85);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      100% {
        transform: translateY(-112vh) scale(1.75);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(94vw, 650px);
      padding: clamp(26px, 5vw, 42px);
      border-radius: 8px;
      background: rgba(42, 22, 64, 0.58);
      border: 1px solid rgba(241, 218, 255, 0.35);
      box-shadow: 0 26px 90px rgba(19, 6, 35, 0.46);
      text-align: center;
      overflow: hidden;
      animation: fadeIn 1.1s ease forwards;
      backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.18), transparent 34%, rgba(255, 211, 234, 0.14));
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(26px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .title,
    .names,
    .message,
    .action,
    .final {
      position: relative;
      z-index: 1;
    }

    .title {
      font-size: clamp(2rem, 6vw, 3.45rem);
      margin-bottom: 18px;
      font-weight: 800;
      letter-spacing: 0;
      color: #ffffff;
      text-shadow: 0 0 28px rgba(217, 184, 255, 0.55);
    }

    .title span {
      color: var(--rose);
      text-shadow: 0 0 18px rgba(255, 211, 234, 0.9);
    }

    .names {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 22px 0;
      flex-wrap: wrap;
    }

    .pill {
      min-width: 92px;
      padding: 10px 16px;
      border-radius: 8px;
      background: rgba(222, 187, 255, 0.18);
      border: 1px solid rgba(246, 225, 255, 0.35);
      color: #fff7ff;
      font-weight: 700;
      animation: pulse 2.25s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.045);
      }
    }

    .message {
      min-height: 230px;
      font-size: clamp(1.04rem, 3.5vw, 1.34rem);
      line-height: 1.64;
      margin-top: 12px;
      white-space: pre-line;
      color: var(--ink);
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 1.15em;
      background: var(--soft);
      margin-left: 3px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }
      51%, 100% {
        opacity: 0;
      }
    }

    .action {
      margin-top: 18px;
      border: 0;
      min-height: 48px;
      padding: 14px 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, #b57cff, #7d4cc4);
      color: white;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(88, 42, 142, 0.45);
      transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
    }

    .action:hover,
    .action:focus-visible {
      transform: translateY(-2px) scale(1.03);
      background: linear-gradient(135deg, #c998ff, #8b55d4);
      box-shadow: 0 18px 38px rgba(88, 42, 142, 0.62);
      outline: 2px solid rgba(255, 240, 255, 0.82);
      outline-offset: 4px;
    }

    .final {
      margin-top: 22px;
      font-size: clamp(1rem, 3.2vw, 1.12rem);
      line-height: 1.45;
      font-weight: 700;
      color: #ffe4f5;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .final.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        padding-top: 18px;
        overflow-y: auto;
      }

      .message {
        min-height: 286px;
      }

      .pill {
        min-width: 84px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="card">
    <h1 class="title">
      Perdóname <span>❤</span>
    </h1>

    <div class="names" aria-label="Personas importantes">
      <div class="pill">Tú</div>
      <div class="pill">Dorian</div>
      <div class="pill">Mi familia</div>
    </div>

    <p class="message">
      <span id="text"></span><span class="cursor"></span>
    </p>

    <button class="action" id="forgiveButton" type="button">
      Toca aquí
    </button>

    <div class="final" id="finalMessage">
      No quiero seguir fallando. Quiero aprender a cuidar lo que más amo.
    </div>
  </main>

  <script>
    const message = `Lo siento.

No quiero perderte ni a ti, ni a Dorian.

Sé que mi actitud es idiota en cada pelea, pero es la única forma que tengo para calmarme y no empeorar las cosas.

Si no digo nada es para evitar seguir peleando, porque los amo y no quiero perderlos.`;

    const textElement = document.getElementById("text");
    const heartsContainer = document.getElementById("hearts");
    const finalMessage = document.getElementById("finalMessage");
    const forgiveButton = document.getElementById("forgiveButton");
    let index = 0;

    function typeMessage() {
      if (index < message.length) {
        textElement.textContent += message.charAt(index);
        index += 1;
        window.setTimeout(typeMessage, 45);
      }
    }

    function createHeart(options = {}) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "❤";
      heart.style.left = `${options.left ?? Math.random() * 100}vw`;
      heart.style.bottom = `${options.bottom ?? -4}vh`;
      heart.style.fontSize = `${options.size ?? Math.random() * 22 + 14}px`;
      heart.style.animationDuration = `${options.duration ?? Math.random() * 4 + 5}s`;
      heartsContainer.appendChild(heart);
      window.setTimeout(() => heart.remove(), options.removeAfter ?? 9000);
    }

    function createFloatingHearts() {
      window.setInterval(() => createHeart(), 360);
    }

    function createHeartBurst() {
      for (let i = 0; i < 30; i += 1) {
        createHeart({
          left: Math.random() * 100,
          bottom: Math.random() * 32,
          size: Math.random() * 26 + 18,
          duration: Math.random() * 2 + 3,
          removeAfter: 5200
        });
      }
    }

    function showFinalMessage() {
      finalMessage.classList.add("show");
      createHeartBurst();
    }

    forgiveButton.addEventListener("click", showFinalMessage);
    forgiveButton.addEventListener("touchend", function (event) {
      event.preventDefault();
      showFinalMessage();
    }, { passive: false });

    typeMessage();
    createFloatingHearts();
  </script>
</body>
</html>
